# Phase 14: OpenAlex management papers and what they borrow from distant fields. Every number here was fixed on
# 10/08/2026, before any phase 14 result existed. Hypotheses: results/phase-14-openalex/HYPOTHESES.md (approved
# 10/08/2026). A change after results exist is a new commit saying why. Step 3 (AWS) is added once step 2 passes.

data: C:/Users/shaun/dianoia-data
mem_mb_total: 5000

openalex:
  # English journal articles, 2015-2024, main field Business, Management and Accounting (field 14), with an abstract
  # and more than 5 references: 504,172 on 10/08/2026.
  filter: "primary_topic.field.id:14,has_abstract:true,type:article,publication_year:2015-2024,referenced_works_count:>5,language:en"
  seeds: [14, 15, 16]                      # OpenAlex samples at most 10,000 per seed
  sample_size: 10000
  per_page: 100
  ref_filter: "primary_topic.domain.id:!2,has_abstract:true"   # cited works outside the Social Sciences (domain 2)
  max_per_second: 8                        # OpenAlex allows 10 (100 with a key)

pairs:
  min_words: 30                            # either abstract shorter -> dropped (OpenAlex holds boilerplate abstracts)

measure_encoder: BAAI/bge-small-en-v1.5    # phase 12's second encoder for "far"
far:                                       # phase 12's far rule, unchanged
  medians: p12/medians.json                # overlap 0.09, cosine 0.6746
  pool: p12/pool.parquet                   # the word-weight basis, so the medians mean the same thing

review:
  n_gold: 10
  gold_seed: 14
  min_gold_hours: 20                       # the blind re-read of the gold pairs comes a day later
  n: 50
  seed: 14                                 # strict reading uses seed + 1
  min_real: 0.70                           # C or G among the 50 strict pairs as drawn

sonnet:
  n: 5000                                  # random far pairs labeled by v3p (gold pairs excluded)
  seed: 14
  min_borrow: 4                            # phase 11's rule: v3p C with borrow >= 4, then v4p C or G
  workers: 4                               # claude -p processes of about 300 MB each
  per_call: 10

aws:                                       # step 1's cosine pass (minutes on one GPU)
  hours: 1                                 # self-terminate cap
  market: od
  budget_left_usd: 4.0                     # of the $95 total; phase 13's GPU runs were the last spend
  max_cost_usd: 1.01

step3:                                     # fixed 10/09/2026 (HYPOTHESES.md, step 3 details)
  seed: 14
  n_test: 300
  n_candidates: 999                        # plus the true source: 1,000, as in phase 12
  top_k: 10
  bootstrap: 2000
  adapters:                                # phase 12's chosen models, unchanged
    far: p12/out/adapters/far-s0-e2
    near: p12/out/adapters/near-s0-e3

embedder: Qwen/Qwen3-Embedding-0.6B
instruct: "Instruct: Given a patent abstract, retrieve an earlier patent from a different field whose idea it borrows\nQuery: "
smoke:
  embedder: trl-internal-testing/tiny-Qwen3ForCausalLM
